version: '3.8'

services:
  # 1. High-throughput message bus for streaming trades
  kafka:
    image: apache/kafka:latest
    container_name: market-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # 2. On-Premises Legacy Database (Port 5432)
  legacy-db:
    image: postgres:16-alpine
    container_name: market-legacy-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: legacy_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - legacy_data:/var/lib/postgresql/data

  # 3. Target Cloud Database (Port 5433 to avoid port collision)
  cloud-db:
    image: postgres:16-alpine
    container_name: market-cloud-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cloud_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - cloud_data:/var/lib/postgresql/data

volumes:
  legacy_data:
  cloud_data: